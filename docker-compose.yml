# docker-compose
# version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: dockers/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/home
    environment:
      # - ENV=production
      # - IS_PERSISTENT=TRUE  # 데이터 유지
      - CHROMA_HOST="chroma"
      - CHROMA_PORT=8500
    depends_on:
      - chroma
    env_file:
      - ./.env
    networks:
      - space_network

  app:
    build:
      context: .
      dockerfile: dockers/app.Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
    networks:
      - space_network
    

# 나중에 다시 체크해야함.
  chroma:
    image: chromadb/chroma:0.6.0
    # container_name: chroma
    # restart: always
    ports:
      - "8500:8500"
    # volumes:
    #   - db:/chroma
    networks:
      - space_network
    environment:
      # - IS_PERSISTENT=TRUE  # 데이터 유지
      - CHROMA_HOST="chroma"
      - CHROMA_PORT=8500

# volumes:
#   chroma_data:
networks:
  space_network:
    # extenral: true

